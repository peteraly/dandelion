name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dandelion_test
      VERCEL_ENV: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit (fail on high/critical)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - name: Create databases
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c "create database dandelion_test" -c "create database dandelion_e2e"
      - run: npm run test:unit
      - run: npm run test:int
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: npm run contracts:test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
